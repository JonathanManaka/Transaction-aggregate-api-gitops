# Overrides for the vendored upstream Grafana chart (see Chart.yaml).
# Values are nested under the dependency name 'grafana'. Anything omitted
# uses the chart defaults.
grafana:

  envValueFrom:
    GF_SECURITY_ADMIN_PASSWORD:
      secretKeyRef:
        name: grafana-secret
        key: grafana-admin-password

  persistence:
    enabled: false

  service:
    type: NodePort
    nodePort: 30300          # Grafana UI at http://localhost:30300

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          # same-namespace short name — resolves in whatever env ns this runs in
          # (dev/int/qa/prod), so no per-env edit needed on promotion
          url: http://prometheus-server
          isDefault: true

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default

  dashboards:
    default:
      # Spring Boot / JVM metrics via Micrometer (/actuator/prometheus)
      jvm-micrometer:
        gnetId: 4701
        revision: 10
        datasource: Prometheus
      # Node & container CPU / memory (prometheus-node-exporter)
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      # Prometheus server health / ingestion
      prometheus-overview:
        gnetId: 3662
        revision: 2
        datasource: Prometheus
