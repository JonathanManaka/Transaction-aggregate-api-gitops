apiVersion: v1
kind: ConfigMap
metadata:
  name: transac-agg-api-config
  namespace: dev
  labels:
    app: transac-agg-api
data:
  APP_PORT: "8080"
  POSTGRES_URL: jdbc:postgresql://host.docker.internal:5432/transac_aggr
  POSTGRES_USERNAME: postgres
  TEMPORAL_HOST: temporal.dev.svc.cluster.local:7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transac-agg-api
  namespace: dev
  labels:
    app: transac-agg-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transac-agg-api
  template:
    metadata:
      labels:
        app: transac-agg-api
    spec:
      containers:
        - name: transac-agg-api
          image: mphojmanaka/transac-aggr-api-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: transac-agg-api-config
            - secretRef:
                name: transac-agg-api-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: transac-agg-api
  namespace: dev
  labels:
    app: transac-agg-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: transac-agg-api
