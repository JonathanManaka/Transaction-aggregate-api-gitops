apiVersion: v1
kind: ConfigMap
metadata:
  name: transac-agg-api-config
  namespace: dev
  labels:
    app: transac-agg-api
data:
  APP_PORT: "8080"
  POSTGRES_URL: jdbc:postgresql://postgres.dev.svc.cluster.local:5432/transac_aggr
  POSTGRES_USERNAME: postgres
  TEMPORAL_HOST: temporal-frontend:7233
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: transac-agg-api
  namespace: dev
  labels:
    app: transac-agg-api
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: transac-agg-api
  strategy:
    blueGreen:
      activeService: transac-agg-api
      previewService: transac-agg-api-preview
      autoPromotionEnabled: false
  template:
    metadata:
      labels:
        app: transac-agg-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: transac-agg-api
          image: mphojmanaka/transac-aggr-api-app:4a0a398
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: transac-agg-api-config
            - secretRef:
                name: transac-agg-api-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: transac-agg-api
  namespace: dev
  labels:
    app: transac-agg-api
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: transac-agg-api
---
apiVersion: v1
kind: Service
metadata:
  name: transac-agg-api-preview
  namespace: dev
  labels:
    app: transac-agg-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: transac-agg-api
