apiVersion: v1
kind: ConfigMap
metadata:
  name: transac-agg-api-config
  namespace: dev
  labels:
    app: transac-agg-api
data:
  APP_PORT: "8080"
  POSTGRES_URL: jdbc:postgresql://postgres.dev.svc.cluster.local:5432/transac_aggr
  POSTGRES_USERNAME: postgres
  TEMPORAL_HOST: temporal.dev.svc.cluster.local:7233
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transac-agg-api
  namespace: dev
  labels:
    app: transac-agg-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transac-agg-api
  template:
    metadata:
      labels:
        app: transac-agg-api
    spec:
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: transac-agg-api
          image: mphojmanaka/transac-aggr-api-app:4097168
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: transac-agg-api-config
            - secretRef:
                name: transac-agg-api-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: transac-agg-api
  namespace: dev
  labels:
    app: transac-agg-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: transac-agg-api
