apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - temporal/deployment.yaml
  - app/deployment.yaml

secretGenerator:
  - name: transac-agg-api-secret
    namespace: dev
    envs:
      - app/.env
    options:
      disableNameSuffixHash: true
      labels:
        app: transac-agg-api
