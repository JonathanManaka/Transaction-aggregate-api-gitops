apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- postgres/deployment.yaml
- postgres/sealed-secret.yaml
- app/deployment.yaml
- grafana/sealed-secret.yaml

# Image tag is managed by CI via `kustomize edit set image` — do not edit by hand.
# This overrides the tag on the image in app/deployment.yaml.
images:
- name: mphojmanaka/transac-aggr-api-app
  newName: mphojmanaka/transac-aggr-api-app
  newTag: 83ea217
