name: Deploy Application

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'terraform/**'
      - '*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to sync'
        required: true
        type: choice
        options:
          - dev
          - int
          - qa
          - prod

env:
  IMAGE_NAME: transac-agg-api
  REGISTRY: ghcr.io
  ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}

jobs:
  # -------------------------------------------------------
  # Build & Push container image
  # -------------------------------------------------------
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------
  # Update image tag in K8s overlay
  # -------------------------------------------------------
  update-manifests:
    name: Update Image Tag
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tag in overlays
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          for env in dev int qa prod; do
            cd k8s/overlays/$env
            kustomize edit set image transac-agg-api=$IMAGE
            cd -
          done

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/
          git diff --staged --quiet || git commit -m "ci: update image tag to ${{ needs.build.outputs.image_tag }}"
          git push

  # -------------------------------------------------------
  # Sync DEV - auto after image update
  # -------------------------------------------------------
  sync-dev:
    name: "Sync DEV"
    needs: update-manifests
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Sync ArgoCD Application
        uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.11.0
          command: app sync transac-agg-dev
          options: |
            --server ${{ env.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web

      - name: Wait for healthy
        uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.11.0
          command: app wait transac-agg-dev
          options: |
            --server ${{ env.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web
            --health
            --timeout 300

  # -------------------------------------------------------
  # Sync INT - after DEV succeeds
  # -------------------------------------------------------
  sync-int:
    name: "Sync INT"
    needs: sync-dev
    runs-on: ubuntu-latest
    environment:
      name: int
    steps:
      - name: Sync ArgoCD Application
        uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.11.0
          command: app sync transac-agg-int
          options: |
            --server ${{ env.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web

      - name: Wait for healthy
        uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.11.0
          command: app wait transac-agg-int
          options: |
            --server ${{ env.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web
            --health
            --timeout 300

  # -------------------------------------------------------
  # Sync QA - after INT succeeds (manual approval via environment)
  # -------------------------------------------------------
  sync-qa:
    name: "Sync QA"
    needs: sync-int
    runs-on: ubuntu-latest
    environment:
      name: qa
    steps:
      - name: Sync ArgoCD Application
        uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.11.0
          command: app sync transac-agg-qa
          options: |
            --server ${{ env.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web

      - name: Wait for healthy
        uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.11.0
          command: app wait transac-agg-qa
          options: |
            --server ${{ env.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web
            --health
            --timeout 300

  # -------------------------------------------------------
  # Sync PROD - after QA succeeds (manual approval via environment)
  # -------------------------------------------------------
  sync-prod:
    name: "Sync PROD"
    needs: sync-qa
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Sync ArgoCD Application
        uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.11.0
          command: app sync transac-agg-prod
          options: |
            --server ${{ env.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web

      - name: Wait for healthy
        uses: clowdhaus/argo-cd-action/@main
        with:
          version: 2.11.0
          command: app wait transac-agg-prod
          options: |
            --server ${{ env.ARGOCD_SERVER }}
            --auth-token ${{ secrets.ARGOCD_AUTH_TOKEN }}
            --grpc-web
            --health
            --timeout 300
