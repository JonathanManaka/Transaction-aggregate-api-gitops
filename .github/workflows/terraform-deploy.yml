name: Terraform Database Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - int
          - qa
          - prod

env:
  TF_VERSION: "1.7.0"
  TF_WORKING_DIR: "./terraform"

jobs:
  # -------------------------------------------------------
  # Plan - runs on every PR and push
  # -------------------------------------------------------
  plan:
    name: "Plan (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.environment)) || fromJSON('["dev"]') }}
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init

      - name: Select Workspace
        run: |
          terraform workspace select ${{ matrix.environment }} || terraform workspace new ${{ matrix.environment }}

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="values/${{ matrix.environment }}/default.auto.tfvars" \
            -var="db_superuser_password=${{ secrets.DB_SUPERUSER_PASSWORD }}" \
            -var="app_db_password=${{ secrets.APP_DB_PASSWORD }}" \
            -out=tfplan-${{ matrix.environment }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan-${{ matrix.environment }}

  # -------------------------------------------------------
  # Deploy DEV - auto on main push
  # -------------------------------------------------------
  deploy-dev:
    name: "Deploy DEV"
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: dev
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Select Workspace
        run: terraform workspace select dev || terraform workspace new dev

      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file="values/dev/default.auto.tfvars" \
            -var="db_superuser_password=${{ secrets.DB_SUPERUSER_PASSWORD }}" \
            -var="app_db_password=${{ secrets.APP_DB_PASSWORD }}" \
            -auto-approve

  # -------------------------------------------------------
  # Deploy INT - requires DEV success
  # -------------------------------------------------------
  deploy-int:
    name: "Deploy INT"
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: int
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Select Workspace
        run: terraform workspace select int || terraform workspace new int

      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file="values/int/default.auto.tfvars" \
            -var="db_superuser_password=${{ secrets.DB_SUPERUSER_PASSWORD }}" \
            -var="app_db_password=${{ secrets.APP_DB_PASSWORD }}" \
            -auto-approve

  # -------------------------------------------------------
  # Deploy QA - requires INT success
  # -------------------------------------------------------
  deploy-qa:
    name: "Deploy QA"
    needs: deploy-int
    runs-on: ubuntu-latest
    environment:
      name: qa
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Select Workspace
        run: terraform workspace select qa || terraform workspace new qa

      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file="values/qa/default.auto.tfvars" \
            -var="db_superuser_password=${{ secrets.DB_SUPERUSER_PASSWORD }}" \
            -var="app_db_password=${{ secrets.APP_DB_PASSWORD }}" \
            -auto-approve

  # -------------------------------------------------------
  # Deploy PROD - requires QA success + manual approval
  # -------------------------------------------------------
  deploy-prod:
    name: "Deploy PROD"
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment:
      name: prod
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Select Workspace
        run: terraform workspace select prod || terraform workspace new prod

      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file="values/prod/default.auto.tfvars" \
            -var="db_superuser_password=${{ secrets.DB_SUPERUSER_PASSWORD }}" \
            -var="app_db_password=${{ secrets.APP_DB_PASSWORD }}" \
            -auto-approve
