name: KICS Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "k8s/**"
      - "gitops/**"

jobs:
  kics:
    name: KICS Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create output directory
        run: mkdir -p kics-results

      - name: Run KICS scan
        uses: checkmarx/kics-github-action@v2
        with:
          path: k8s/
          output_formats: sarif
          output_path: kics-results/
          ignore_on_exit: results
          exclude_queries: >-
            a88baa78-d1dc-4c78-bcf4-82c1954a52e2,
            48a5beba-e4c0-4584-a2aa-e6894e4cf424,
            302736f4-b16b-4b74-8eff-14a8bc4b6d1d

      - name: Upload KICS results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: kics-results/results.sarif
