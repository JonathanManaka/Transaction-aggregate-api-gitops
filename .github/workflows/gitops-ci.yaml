name: GitOps CI

on:
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - "gitops/**"
  pull_request:
    paths:
      - "k8s/**"
      - "gitops/**"

jobs:
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: k8s/ gitops/
          config_data: |
            extends: default
            ignore: |
              **/sealed-secret.yaml
              k8s/temporal/templates/
              k8s/temporal/values/
              k8s/temporal/ci/
            rules:
              line-length:
                max: 120
              document-start: disable
              indentation:
                # kustomize edit writes block sequences flush-left; allow that
                # while still permitting indented sequences in other files
                indent-sequences: consistent
              truthy:
                allowed-values: ["true", "false"]

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Kustomize build
        run: kustomize build k8s/ > /tmp/rendered.yaml

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate against Kubernetes schema
        run: |
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.29.0 \
            -skip SealedSecret \
            /tmp/rendered.yaml

      - name: Install conftest
        run: |
          LATEST_VERSION=$(wget -O - "https://api.github.com/repos/open-policy-agent/conftest/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' | cut -c 2-)
          ARCH=$(arch)
          SYSTEM=$(uname)
          wget "https://github.com/open-policy-agent/conftest/releases/download/v${LATEST_VERSION}/conftest_${LATEST_VERSION}_${SYSTEM}_${ARCH}.tar.gz"
          tar xzf conftest_${LATEST_VERSION}_${SYSTEM}_${ARCH}.tar.gz
          sudo mv conftest /usr/local/bin

      - name: Policy checks
        run: conftest test /tmp/rendered.yaml --policy .github/policies/
